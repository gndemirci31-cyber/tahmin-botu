name: Tahmin Botu

on:
  schedule:
    # TR 10:00 (UTC 07:00) → Günün Tahminleri
    - cron: "0 7 * * *"
    # TR 04:00 (UTC 01:00, ertesi gün) → Dünün Sonuçları & Öğrenme
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Manuel çalışma modu"
        required: true
        type: choice
        options:
        - "AUTO"
        - "PREDICT" 
        - "RESULTS"
        default: "AUTO"

permissions:
  contents: write

concurrency:
  group: tahmin-botu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install numpy scipy scikit-learn requests xgboost joblib
          fi

      - name: Çalışma Modunu Belirle
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -e
          echo "::notice::event.schedule='$SCHEDULE' input.mode='$INPUT_MODE'"
          
          # Manuel mod seçimi
          if [ "$INPUT_MODE" = "PREDICT" ]; then
            echo "mode=PREDICT" >> "$GITHUB_OUTPUT"
            echo "✅ PREDICT modu seçildi"
            exit 0
          elif [ "$INPUT_MODE" = "RESULTS" ]; then
            echo "mode=RESULTS" >> "$GITHUB_OUTPUT" 
            echo "✅ RESULTS modu seçildi"
            exit 0
          fi
          
          # Schedule tetikleyicisi kontrolü
          if [ "$SCHEDULE" = "0 7 * * *" ]; then
            echo "mode=PREDICT" >> "$GITHUB_OUTPUT"
            echo "⏰ Schedule: PREDICT modu (10:00 TR)"
            exit 0
          elif [ "$SCHEDULE" = "0 1 * * *" ]; then
            echo "mode=RESULTS" >> "$GITHUB_OUTPUT"
            echo "⏰ Schedule: RESULTS modu (04:00 TR)" 
            exit 0
          fi
          
          # Varsayılan AUTO modu - UTC saatine göre
          HOUR="$(date -u +%H)"
          if [ "$HOUR" -ge 7 ] && [ "$HOUR" -lt 19 ]; then
            echo "mode=PREDICT" >> "$GITHUB_OUTPUT"
            echo "🤖 AUTO: PREDICT modu (gündüz)"
          else
            echo "mode=RESULTS" >> "$GITHUB_OUTPUT"
            echo "🤖 AUTO: RESULTS modu (gece)"
          fi

      - name: Botu çalıştır
        env:
          # Mail bilgileri
          GMAIL_USER:            ${{ secrets.GMAIL_USER }}
          GMAIL_PASS:            ${{ secrets.GMAIL_PASS }}
          GMAIL_TO:              ${{ secrets.GMAIL_TO }}

          # API-Football v3 entegrasyonu - YENİ HEADERS FORMATI
          APIFOOTBALL_KEY:       ${{ secrets.APIFOOTBALL_KEY }}

          # İsteğe bağlı: The Odds API (oranlar)
          ODDS_API_KEY:          ${{ secrets.ODDS_API_KEY }}

          # Yeni özellikler
          WEATHER_API_KEY:       ${{ secrets.WEATHER_API_KEY || '' }}
          MODEL_VERSION:         ${{ vars.MODEL_VERSION || 'v2025.10.18-api-v3-simplified' }}

          # Çalışma modu
          MODE:                  ${{ steps.pick.outputs.mode }}

          # --- Opsiyonel ayarlar
          TOP_N:                 ${{ vars.TOP_N                 || '5'   }}
          MIN_CONF:              ${{ vars.MIN_CONF              || '0'   }}
          HIGH_ALERT:            ${{ vars.HIGH_ALERT            || '90'  }}

          ELO_K:                 ${{ vars.ELO_K                 || '24'  }}
          ELO_HOME_ADV:          ${{ vars.ELO_HOME_ADV          || '40'  }}
          FORM_LOOKBACK:         ${{ vars.FORM_LOOKBACK         || '10'  }}
          FORM_DAYS:             ${{ vars.FORM_DAYS             || '120' }}
          ALLOW_STATE_FILE:      ${{ vars.ALLOW_STATE_FILE      || '1'   }}

          # Otomatik öğrenme
          W_MKT_INIT:            ${{ vars.W_MKT_INIT            || '0.45' }}
          LEARN_RATE:            ${{ vars.LEARN_RATE            || '0.05' }}
          GOAL_LR:               ${{ vars.GOAL_LR               || '0.02'  }}

          # Table/Streak ayarları
          TABLE_WEIGHT:          ${{ vars.TABLE_WEIGHT          || '0.12' }}
          STREAK_UNIT:           ${{ vars.STREAK_UNIT           || '0.02' }}
          STREAK_MAX:            ${{ vars.STREAK_MAX            || '0.08' }}

          # Ensemble ayarları
          ENSEMBLE_MIN_TRAINING: ${{ vars.ENSEMBLE_MIN_TRAINING || '50' }}
        run: |
          set -e
          mkdir -p snapshots
          echo "🚀 Bot başlatılıyor: $MODE modu"
          python mailer.py --mode "$MODE"

      - name: State'i kalıcılaştır (TÜM MODLAR)
        if: always()
        run: |
          set -e
          # Yeni state dosyalarını da kontrol et
          STATE_FILES="model_state.json team_values.json national_elo.json ensemble_model.pkl"
          
          for file in $STATE_FILES; do
            if [ -f "$file" ] && [ -s "$file" ]; then
              git add -f "$file"
              echo "✅ $file eklendi"
            fi
          done
          
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Değişiklik kontrolü
          git commit -m "chore(state): auto-update $(date -u +'%Y-%m-%dT%H:%MZ') [skip ci]" || echo "ℹ state'te değişiklik yok - commit gerekmez"
          git push || echo "ℹ push gerekmez (branch güncel)"
          
          echo "✅ Tüm state dosyaları kalıcılaştırıldı"
