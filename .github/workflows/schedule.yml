name: Tahmin Botu

on:
  schedule:
    # TR 10:00 (UTC 07:00) → Günün Tahminleri
    - cron: "0 7 * * *"
    # TR 23:59 (UTC 20:59) → Günün Sonuçları
    - cron: "59 20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Manuel çalıştırma modu (AUTO/PREDICT/RESULTS)"
        required: false
        default: "AUTO"
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt
            - name: Sabah/Gece modu seç
        id: pick
        env:
          DISPATCH_MODE: ${{ github.event.inputs.mode || '' }}
        run: |
          # Manuel tetikleme: mode parametresi geldiyse onu kullan
          if [ -n "$DISPATCH_MODE" ] && [ "$DISPATCH_MODE" != "AUTO" ]; then
            echo "mode=$DISPATCH_MODE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Otomatik (cron): UTC saate göre
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "07" ]; then
            echo "mode=PREDICT" >> "$GITHUB_OUTPUT"
          else
            echo "mode=RESULTS" >> "$GITHUB_OUTPUT"
          fi

      - name: Botu çalıştır
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GMAIL_TO:   ${{ secrets.GMAIL_TO }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          MODE: ${{ steps.pick.outputs.mode }}
        run: python mailer.py

