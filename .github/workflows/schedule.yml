name: Tahmin Botu

on:
  schedule:
    - cron: "0 12 * * *"   # Her gün 15:00 Türkiye saati (TR=UTC+3 → 12:00 UTC)
  workflow_dispatch: {}     # Elle test için

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Çalıştır
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GMAIL_TO:   ${{ secrets.GMAIL_TO }}
        run: python mailer.py morning
