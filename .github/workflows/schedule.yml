name: Tahmin Botu

on:
  schedule:
    - cron: "0 7 * * *"     # Her gün 10:00 Türkiye saati (TR=UTC+3 → 07:00 UTC)
    - cron: "59 20 * * *"   # Her gün 23:59 Türkiye saati (TR=UTC+3 → 20:59 UTC)
  workflow_dispatch: {}      # Elle tetiklemek için
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Çalıştır
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GMAIL_TO:   ${{ secrets.GMAIL_TO }}
        run: python mailer.py morning
