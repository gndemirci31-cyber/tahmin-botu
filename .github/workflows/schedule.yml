name: Tahmin Botu

on:
  schedule:
    - cron: "0 7 * * *"   # TR 10:00 → Günün Tahminleri
    - cron: "0 1 * * *"   # TR 04:00 → Dünün Sonuçları
  workflow_dispatch:
    inputs:
      mode:
        description: "Manuel çalışma modu (AUTO / PREDICT / RESULTS)"
        required: false
        default: "AUTO"

permissions:
  contents: write

concurrency:
  group: tahmin-botu
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Sabah/Gece seçimi (cron'a göre)
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -e
          echo "::notice::event.schedule='$SCHEDULE' input.mode='$INPUT_MODE'"
          if [ "$INPUT_MODE" = "PREDICT" ] || [ "$INPUT_MODE" = "RESULTS" ]; then
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$SCHEDULE" = "0 7 * * *" ]; then
            echo "mode=PREDICT" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$SCHEDULE" = "0 1 * * *" ]; then
            echo "mode=RESULTS" >> "$GITHUB_OUTPUT"; exit 0; fi
          HOUR="$(date -u +%H)"
          if [ "$HOUR" = "07" ]; then echo "mode=PREDICT" >> "$GITHUB_OUTPUT";
          elif [ "$HOUR" = "01" ]; then echo "mode=RESULTS" >> "$GITHUB_OUTPUT";
          else echo "mode=RESULTS" >> "$GITHUB_OUTPUT"; fi

      # ---- TANI ADIMLARI (basit, YAML güvenli) ----
      - name: Çalışma dizinini ve dosyayı göster
        run: |
          pwd
          ls -la

      - name: mailer.py parmak izi ve MODEL_VERSION kontrolü
        run: |
          python -c "import pathlib,hashlib,re,os,sys; p=pathlib.Path('mailer.py'); \
txt=p.read_text(encoding='utf-8',errors='ignore') if p.exists() else ''; \
print('exists mailer.py:',p.exists(),'size:',(p.stat().st_size if p.exists() else None)); \
print('SHA1(mailer.py)=', (hashlib.sha1(p.read_bytes()).hexdigest()[:12] if p.exists() else 'N/A')); \
m=re.search(r\"MODEL_VERSION\\s*=\\s*os\\.getenv\\(\\s*['\\\"]MODEL_VERSION['\\\"]\\s*,\\s*['\\\"]([^'\\\"]+)['\\\"]\\s*\\)\", txt); \
print('MODEL_VERSION in file:', (m.group(1) if m else None)); \
print('has_DElo_tag:', ('ΔElo' in txt))"
      # ---- /TANI ADIMLARI ----

      - name: Botu çalıştır
        env:
          GMAIL_USER:            ${{ secrets.GMAIL_USER }}
          GMAIL_PASS:            ${{ secrets.GMAIL_PASS }}
          GMAIL_TO:              ${{ secrets.GMAIL_TO }}
          FOOTBALL_DATA_TOKEN:   ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ODDS_API_KEY:          ${{ secrets.ODDS_API_KEY }}
          APIFOOTBALL_KEY:       ${{ secrets.APIFOOTBALL_KEY }}
          CARDS_URLS:            ${{ secrets.CARDS_URLS }}
          CORNERS_URLS:          ${{ secrets.CORNERS_URLS }}
          RESULTS_URLS:          ${{ secrets.RESULTS_URLS }}
          FOOTYSTATS_API_KEY:    ${{ secrets.FOOTYSTATS_API_KEY }}
          MODE:                  ${{ steps.pick.outputs.mode }}
          TOP_N:                 ${{ vars.TOP_N                 || '5'   }}
          MIN_CONF:              ${{ vars.MIN_CONF              || '0'   }}
          HIGH_ALERT:            ${{ vars.HIGH_ALERT            || '90'  }}
          SPLIT_HIGH_ALERT_MAIL: ${{ vars.SPLIT_HIGH_ALERT_MAIL || '0'   }}
          OLD_LEAGUES:           ${{ vars.OLD_LEAGUES           || 'bundesliga,bundesliga2' }}
          ODDS_TTL_MIN:          ${{ vars.ODDS_TTL_MIN          || '15'  }}
          ELO_K:                 ${{ vars.ELO_K                 || '24'  }}
          ELO_HOME_ADV:          ${{ vars.ELO_HOME_ADV          || '60'  }}
          FORM_LOOKBACK:         ${{ vars.FORM_LOOKBACK         || '10'  }}
          FORM_DAYS:             ${{ vars.FORM_DAYS             || '120' }}
          ALLOW_STATE_FILE:      ${{ vars.ALLOW_STATE_FILE      || '1'   }}
          W_MKT_INIT:            ${{ vars.W_MKT_INIT            || '0.35' }}
          LEARN_RATE:            ${{ vars.LEARN_RATE            || '0.05' }}
          GOAL_LR:               ${{ vars.GOAL_LR               || '0.02' }}
          PRED_MATCH_WINDOW_HRS: ${{ vars.PRED_MATCH_WINDOW_HRS || '48'   }}
          TABLE_WEIGHT:          ${{ vars.TABLE_WEIGHT          || '0.12' }}
          STREAK_UNIT:           ${{ vars.STREAK_UNIT           || '0.02' }}
          STREAK_MAX:            ${{ vars.STREAK_MAX            || '0.08' }}
        run: |
