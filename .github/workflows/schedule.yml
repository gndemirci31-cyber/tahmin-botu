name: Tahmin Botu

on:
  schedule:
    # TR 10:00 (UTC 07:00) → Günün Tahminleri
    - cron: "0 7 * * *"
    # TR 23:59 (UTC 20:59) → Günün Sonuçları
    - cron: "59 20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Manuel çalışma modu (AUTO / PREDICT / RESULTS)"
        required: false
        default: "AUTO"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Sabah/Gece seçimi
        id: pick
        run: |
          set -e
          INPUT_MODE="${{ github.event.inputs.mode }}"

          # Manuel PREDICT/RESULTS seçildiyse aynen kullan
          if [ "$INPUT_MODE" = "PREDICT" ]; then
            echo "mode=PREDICT" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$INPUT_MODE" = "RESULTS" ]; then
            echo "mode=RESULTS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # AUTO: UTC saate göre karar ver
          HOUR="$(date -u +%H)"
          if [ "$HOUR" = "07" ]; then
            echo "mode=PREDICT" >> "$GITHUB_OUTPUT"   # TR 10:00
          else
            echo "mode=RESULTS" >> "$GITHUB_OUTPUT"   # TR 23:59
          fi

      - name: Botu çalıştır
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GMAIL_TO:   ${{ secrets.GMAIL_TO }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MODE: ${{ steps.pick.outputs.mode }}
        run: python mailer.py
