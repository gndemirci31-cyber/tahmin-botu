name: Tahmin Botu

on:
  schedule:
    # TR 10:00 (UTC 07:00) → Günün Tahminleri
    - cron: "0 7 * * *"
    # TR 04:00 (UTC 01:00, ertesi gün) → Dünün Sonuçları & Öğrenme
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Manuel çalışma modu"
        required: true
        type: choice
        options:
        - "AUTO"
        - "PREDICT" 
        - "RESULTS"
        default: "AUTO"

permissions:
  contents: write

concurrency:
  group: tahmin-botu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # state push için geçmiş gerekir

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install numpy scipy scikit-learn requests
          fi

      - name: Çalışma Modunu Belirle
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -e
          echo "::notice::event.schedule='$SCHEDULE' input.mode='$INPUT_MODE'"
          
          # Manuel mod seçimi
          if [ "$INPUT_MODE" = "PREDICT" ]; then
            echo "mode=PREDICT" >> "$GITHUB_OUTPUT"
            echo "✅ PREDICT modu seçildi"
            exit 0
          elif [ "$INPUT_MODE" = "RESULTS" ]; then
            echo "mode=RESULTS" >> "$GITHUB_OUTPUT" 
            echo "✅ RESULTS modu seçildi"
            exit 0
          fi
          
          # Schedule tetikleyicisi kontrolü
          if [ "$SCHEDULE" = "0 7 * * *" ]; then
            echo "mode=PREDICT" >> "$GITHUB_OUTPUT"
            echo "⏰ Schedule: PREDICT modu (10:00 TR)"
            exit 0
          elif [ "$SCHEDULE" = "0 1 * * *" ]; then
            echo "mode=RESULTS" >> "$GITHUB_OUTPUT"
            echo "⏰ Schedule: RESULTS modu (04:00 TR)" 
            exit 0
          fi
          
          # Varsayılan AUTO modu - UTC saatine göre
          HOUR="$(date -u +%H)"
          if [ "$HOUR" -ge 7 ] && [ "$HOUR" -lt 19 ]; then
            echo "mode=PREDICT" >> "$GITHUB_OUTPUT"
            echo "🤖 AUTO: PREDICT modu (gündüz)"
          else
            echo "mode=RESULTS" >> "$GITHUB_OUTPUT"
            echo "🤖 AUTO: RESULTS modu (gece)"
          fi

      - name: Botu çalıştır
        env:
          # Mail bilgileri (Actions Secrets'tan)
          GMAIL_USER:            ${{ secrets.GMAIL_USER }}
          GMAIL_PASS:            ${{ secrets.GMAIL_PASS }}
          GMAIL_TO:              ${{ secrets.GMAIL_TO }}

          # Zorunlu kaynak: API-Football (FD'yi bilerek boş bırakıyoruz)
          APIFOOTBALL_KEY:       ${{ secrets.APIFOOTBALL_KEY }}

          # İsteğe bağlı: The Odds API (oranlar)
          ODDS_API_KEY:          ${{ secrets.ODDS_API_KEY }}

          # Fallback veri kaynakları (CSV/JSON linkleri - opsiyonel)
          CARDS_URLS:            ${{ secrets.CARDS_URLS }}
          CORNERS_URLS:          ${{ secrets.CORNERS_URLS }}
          RESULTS_URLS:          ${{ secrets.RESULTS_URLS }}
          FOOTYSTATS_API_KEY:    ${{ secrets.FOOTYSTATS_API_KEY }}

          # Çalışma modu
          MODE:                  ${{ steps.pick.outputs.mode }}

          # --- Opsiyonel ayarlar (yoksa güvenli varsayılanlar)
          TOP_N:                 ${{ vars.TOP_N                 || '5'   }}
          MIN_CONF:              ${{ vars.MIN_CONF              || '0'   }}
          HIGH_ALERT:            ${{ vars.HIGH_ALERT            || '90'  }}
          SPLIT_HIGH_ALERT_MAIL: ${{ vars.SPLIT_HIGH_ALERT_MAIL || '0'   }}

          OLD_LEAGUES:           ${{ vars.OLD_LEAGUES           || 'bundesliga,bundesliga2' }}
          ODDS_TTL_MIN:          ${{ vars.ODDS_TTL_MIN          || '15'  }}

          ELO_K:                 ${{ vars.ELO_K                 || '24'  }}
          ELO_HOME_ADV:          ${{ vars.ELO_HOME_ADV          || '40'  }}
          FORM_LOOKBACK:         ${{ vars.FORM_LOOKBACK         || '10'  }}
          FORM_DAYS:             ${{ vars.FORM_DAYS             || '120' }}
          ALLOW_STATE_FILE:      ${{ vars.ALLOW_STATE_FILE      || '1'   }}

          # Otomatik öğrenme & eşleştirme
          W_MKT_INIT:            ${{ vars.W_MKT_INIT            || '0.45' }}
          LEARN_RATE:            ${{ vars.LEARN_RATE            || '0.05' }}
          GOAL_LR:               ${{ vars.GOAL_LR               || '0.02'  }}
          PRED_MATCH_WINDOW_HRS: ${{ vars.PRED_MATCH_WINDOW_HRS || '48'    }}

          # Table/Streak ayarları
          TABLE_WEIGHT:          ${{ vars.TABLE_WEIGHT          || '0.12' }}
          STREAK_UNIT:           ${{ vars.STREAK_UNIT           || '0.02' }}
          STREAK_MAX:            ${{ vars.STREAK_MAX            || '0.08' }}

          # Anti home-bias ayarları
          HOME_ADV_MAX:          ${{ vars.HOME_ADV_MAX          || '8'    }}
          MIN_MARKET_WEIGHT:     ${{ vars.MIN_MARKET_WEIGHT     || '0.60' }}
        run: |
          set -e
          mkdir -p snapshots
          echo "🚀 Bot başlatılıyor: $MODE modu"
          python mailer.py --mode "$MODE"

      - name: State'i kalıcılaştır (PREDICT ve RESULTS)
        if: always() && (steps.pick.outputs.mode == 'PREDICT' || steps.pick.outputs.mode == 'RESULTS')
        run: |
          set -e
          if [ -f model_state.json ] && [ -s model_state.json ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git diff --quiet -- model_state.json; then
              git add -f model_state.json
              git commit -m "chore(state): ${{ steps.pick.outputs.mode }} update $(date -u +'%Y-%m-%dT%H:%MZ') [skip ci]"
              git push
              echo "✔ model_state.json commit/push edildi."
            else
              echo "ℹ state'te değişiklik yok."
            fi
          else
            echo "ℹ model_state.json bulunamadı veya boş."
          fi
